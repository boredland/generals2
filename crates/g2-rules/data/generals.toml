# One general per faction for now, to exercise generals-as-data. The names are documented G2
# generals; what each changed is not, so these economy modifiers are
# placeholders in the spirit of pre-release sub-general designs (e.g. a supply doctrine:
# cheaper supply trucks, faster builds). Each has one active power, modelled on support
# powers the archive documents for other generals of the same side (numbers placeholders).
#
# Each general's `power` is its rank-1 power; `power_levels` its levels from general ranks 3
# and 5. `units` adds units at a factory or constructor (`at`), in place of `replaces` where
# given. `perks` lists the perks the general may slot, cheapest rank first.

[[general]]
id = "bulldog"
name = "Bulldog"
faction = "eu"
# Power plants at 130% (120% before): with the EU harvester's 4 s load (units.toml) its
# cheaper harvesters made Bulldog 15 of 18 in `g2-tools generals`, 11 at 130% (12 with the
# harvesters at 90%, 15 with the barrage at 30 to 45).
modifiers = [
    { unit = "eu_harvester", cost_percent = 80 },
    { unit = "eu_harvester", build_time_percent = 85 },
    { unit = "eu_power", cost_percent = 130 },
]
perks = [
    "bd_double_shifts",
    "bd_heavy_payload",
    "bd_protector_i",
    "bd_protector_ii",
    "bd_factory_overtime",
    "bd_insourced",
    "bd_aerodynamics_i",
    "bd_aerodynamics_ii",
]

# After the EU general Salvo's "Suppressing fire" (an artillery strike called onto the
# field): seven shells on and around the point, half a second apart after a 3 s delay.
# Placeholder numbers. No bonus against buildings: with one it took half a command
# center per use, a base-killer rather than a strike on an army. Shell damage 45 (90, then
# 54), tuned by `g2-tools generals`: Bulldog 13 of 18 at 90, 12 at 54; once heroes came in,
# 13 at 54 again, 12 at 45 (11 at 40); with the power plants at 130% (below) 11 at 45, 13
# at 54.
[general.power]
name = "Artillery barrage"
recharge = 240
kind = "barrage"
shells = 7
delay = 3
every = 0.5
damage = 45
bonus = { light = 20 }
radius = 7
# levels: more shells (placeholders; the general is ours).

[[general.power_levels]]
name = "Artillery barrage"
recharge = 240
kind = "barrage"
shells = 7
delay = 3
every = 0.5
damage = 45
bonus = { light = 20 }
radius = 7

[[general.power_levels]]
name = "Artillery barrage"
recharge = 240
kind = "barrage"
shells = 9
delay = 3
every = 0.5
damage = 45
bonus = { light = 20 }
radius = 7


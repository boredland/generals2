# Battle Bunker (gu_battlebus_bunker, a structure blueprint): what the Battle Bus becomes.
# hp 525, room for four squads who fire out with an 8-unit range bonus, and die with it
# (`DieWithGarrison`); it can't move. Never built (its 45 s build time and $750 cost are
# unused). Radius 4: the bus's `EntityRadius` 3.5, rounded up.
[[building]]
id = "gla_battle_bunker"
name = "GLA Battle Bunker"
faction = "gla"
role = "bunker"
hp = 525
radius = 4
garrison = { capacity = 4, fires = true, range_bonus = 8 }

# src: the alpha's gs_tunnelnetwork_entrance (built by the Worker): MaxHealth 500, $600,
# BuildTime 30 s, build grid half-extent 10. Its garrison numbers aren't in its data (its
# `RtsTunnelAccessComponentData` holds only a rally distance), so they are Zero Hour's
# (EA's GPL INI, reference only): `MaxTunnelCapacity` 10 for the network, `TimeForFullHeal`
# 5 s. The alpha's exit (gs_tunnelnetwork_exit, $300) is trained at an entrance; here
# every tunnel is a full entrance.
[[building]]
id = "gla_tunnel"
name = "GLA Tunnel Network"
faction = "gla"
role = "tunnel"
hp = 500
cost = 600
build_time = 30
radius = 10
garrison = { capacity = 10, heal_time = 5 }

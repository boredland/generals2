# Buildings, map features and the neutral civilian buildings. Ids are stable: the game refers
# to many by name (`eu_cc`), and the order here is the order of the rest. Fields and units:
# docs/RULES.md.
#
# Values marked `src:` come from archived reference material, documented in notes kept
# outside this repository. Everything else is a placeholder chosen for playability and will
# be tuned.
#
# A power plant's `power_radius` is 60; a building with no `armour` is `structure`. Civilian
# buildings: infantry garrison them, firing out with the alpha's 8-unit range bonus.

[[building]]
id = "supply_pile"
name = "Supply Pile"
role = "supply_pile"
hp = 1
radius = 4

[[building]]
id = "oil_well"
name = "Oil Well"
role = "oil_well"
hp = 1
radius = 5


# Units, one entity per squad, with the squad's card values. Ids are stable: the game refers
# to many by name (`eu_recon`). Fields and units: docs/RULES.md.
#
# Values marked `src:` come from archived reference material, documented in notes kept
# outside this repository. Everything else is a placeholder chosen for playability and will
# be tuned.
#
# `radius` is the alpha blueprint's `EntityRadius` (2 for infantry and light vehicles, 3.5 for
# tanks, 4 for aircraft). Without a sourced armour class, unarmed vehicles are `light` and GLA
# workers `infantry` (placeholders). Support aircraft (no cost, no build time) fly one pass
# for a power, never built, worth the usual 1 experience to whoever shoots one down.

# The alpha's rules for every unit that earns ranks: 1 experience per kill (buildings grant
# none), ranks at 3, 6 and 10, rank 2 regenerating 5 hit points a second while idle. A unit's
# `ranks` gives its rank-1 hit points (`health`) and its rank-3 fire interval in percent
# (`cooldown_percent`), from the alpha unit's own `RtsVeterancyComponentData` (the interval
# cut as a share of that unit's main weapon interval, since some of our guns are stand-ins
# with other intervals).
ranks = { at = [3, 6, 10], idle_regen = 5 }


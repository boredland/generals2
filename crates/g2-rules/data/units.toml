# (the APA harvester's is 120, the GLA worker's 110). Load and unload times are
# placeholders. On the 33 maps, at the APA harvester's 100 the EU won 55 of 132 at Easy
# and 13 of 131 at Normal, at 190 63 and 74. The APA's 120 was measured too: Normal APA then

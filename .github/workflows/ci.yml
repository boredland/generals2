name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push supersedes the run in flight; saves minutes on long Bevy builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artefacts are useless on a fresh runner and bloat the cache.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # g2-maps and g2-rules tests read map sources from vendor/ea/CnC_Modding_Support.
      - uses: actions/checkout@v4

      - name: Fetch map sources
        run: git submodule update --init --depth 1 vendor/ea/CnC_Modding_Support

      # Same package set as scripts/build-appimage.sh; Bevy is built X11-only (no Wayland headers).
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libx11-dev libxkbcommon-dev libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Match-heavy tests (18 recorded matches per AI pairing) take far too long at the
      # dev profile opt-level; the suite is measured in seconds when built optimised.
      - name: Test
        run: cargo test --workspace --release
